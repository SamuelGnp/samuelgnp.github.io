---
layout: page
title: Projects
---
<section class="list">
    <div class="item">
        <a class="url" href="https://esro.sk">
            <h3 class="title">esro.sk</h3>
        </a>
    </div>
    <div class="item">
        <a class="url" href="{{ site.url }}/what-i-learned-reading-nanochat/">
            <h3 class="title">Nanochat study</h3>
        </a>
    </div>
    {% for post in site.posts %}
        {% if post.projects %}
            <div class="item {% if post.star %}star{% endif %}">
                <a class="url" href="{% if post.externalLink %}{{ post.externalLink }}{% else %}{{ site.url }}{{ post.url }}{% endif %}">
                    <h3 class="title">{{ post.title }}</h3>
                </a>
            </div>
        {% endif %}
    {% endfor %}
</section>
